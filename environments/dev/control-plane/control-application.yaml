apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name     : control-plane
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name     : in-cluster
    namespace: argocd
  source:
    path   : "environments/dev/control-plane/applications"
    repoURL: "https://github.com/zbykovskyi/argocd.git"
    targetRevision: multienv
  project: default
  syncPolicy:
    automated:
      prune   : true
      selfHeal: true
